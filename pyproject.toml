[tool.poetry]
name = "ml-data"
version = "0.1.0"
description = ""
authors = ["Ben0112358"]
readme = "README.md"

packages = [
  { include = "ml_data", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
pandas = ">=2.3.1,<4.0.0"
pyyaml = "^6.0.2"
scikit-learn = "^1.7.0"
yfinance = ">=0.2.65,<1.8.0"
urllib3 = ">=2.7.0,<3.0.0"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
flake8 = "^7.3.0"
pytest = "^9.0.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79

[tool.pytest.ini_options]
pythonpath = ["src"]
